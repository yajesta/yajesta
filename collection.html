<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dogs · Oscar</title>
    <meta name="description" content="Dog photos. Mostly Uno.">
    <meta name="theme-color" content="#a1b3c8">
    <link rel="icon" href="/images/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <a class="skip" href="#content">Skip to content</a>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/">Oscar</a>
        <nav aria-label="Page">
          <div class="nav">
            <a href="/#games">Games</a>
            <a href="/#design">Design</a>
            <a href="/#projects">Projects</a>
            <a href="/collection" aria-current="page">Dogs</a>
          </div>
        </nav>
      </div>
    </header>
    <main id="content" class="wrap">
      <section class="hero" aria-labelledby="dogs-title">
        <img class="avatar" src="/images/oscar.webp" width="640" height="640" alt="">
        <div>
          <p class="kicker">Mostly Uno</p>
          <h1 id="dogs-title">Dogs</h1>
          <p class="lede">A page of dog photos. Mostly Uno.</p>
        </div>
      </section>
      <div class="photo-grid">
        <figure class="photo-card">
          <img src="/images/dogs/very-happy-dog.webp" alt="Very happy dog" width="800" height="800" loading="lazy">
          <figcaption><strong>Very happy dog</strong><span>Aug 2024</span></figcaption>
        </figure>
        <figure class="photo-card">
          <img src="/images/dogs/closeup-of-uno.webp" alt="Close up of Uno" width="800" height="800" loading="lazy">
          <figcaption><strong>Close up of Uno</strong><span>Jul 2024</span></figcaption>
        </figure>
        <figure class="photo-card">
          <img src="/images/dogs/jack-with-tongue.webp" alt="Jack with tongue out" width="800" height="800" loading="lazy">
          <figcaption><strong>Jack with tongue out</strong><span>May 2024</span></figcaption>
        </figure>
        <figure class="photo-card">
          <img src="/images/dogs/just-wokeup.webp" alt="Just woke up" width="800" height="800" loading="lazy">
          <figcaption><strong>Just woke up</strong><span>Apr 2024</span></figcaption>
        </figure>
        <figure class="photo-card">
          <img src="/images/dogs/feet-in-the-air.webp" alt="Sleeping with feet in the air" width="800" height="800" loading="lazy">
          <figcaption><strong>Sleeping with feet in the air</strong><span>Feb 2024</span></figcaption>
        </figure>
        <figure class="photo-card">
          <img src="/images/dogs/super-happy-dog.webp" alt="Super happy dog" width="800" height="800" loading="lazy">
          <figcaption><strong>Super happy dog</strong><span>Jan 2024</span></figcaption>
        </figure>
        <figure class="photo-card">
          <img src="/images/dogs/unoalana.webp" alt="Uno and Alana" width="800" height="800" loading="lazy">
          <figcaption><strong>Uno and Alana</strong><span>Dec 2023</span></figcaption>
        </figure>
        <figure class="photo-card">
          <img src="/images/dogs/uno-being-helpful.webp" alt="Uno being super helpful" width="800" height="800" loading="lazy">
          <figcaption><strong>Uno being super helpful</strong><span>Nov 2023</span></figcaption>
        </figure>
        <figure class="photo-card">
          <img src="/images/dogs/uno-in-a-bag.webp" alt="Uno in a bag" width="800" height="800" loading="lazy">
          <figcaption><strong>Uno in a bag</strong><span>Oct 2023</span></figcaption>
        </figure>
        <figure class="photo-card">
          <img src="/images/dogs/uno-on-halloween.webp" alt="Uno on Halloween" width="800" height="800" loading="lazy">
          <figcaption><strong>Uno on Halloween</strong><span>Oct 2023</span></figcaption>
        </figure>
        <figure class="photo-card">
          <img src="/images/dogs/super-sleepy-dog.webp" alt="Uno super sleepy" width="800" height="800" loading="lazy">
          <figcaption><strong>Uno super sleepy</strong><span>Sep 2023</span></figcaption>
        </figure>
        <figure class="photo-card">
          <img src="/images/dogs/uno-turning-one.webp" alt="Uno turning one" width="800" height="800" loading="lazy">
          <figcaption><strong>Uno turning one</strong><span>Aug 2023</span></figcaption>
        </figure>
        <figure class="photo-card">
          <img src="/images/dogs/uno-young.webp" alt="Young Uno" width="800" height="800" loading="lazy">
          <figcaption><strong>Young Uno</strong><span>Jun 2023</span></figcaption>
        </figure>
      </div>
    </main>
  </body>
</html>
